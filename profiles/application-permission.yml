hapi:
  fhir:
    permission:
      enabled: true
      expose-operations: true
      enable-interceptors: true
      allow-inline-permissions: true
      require-token: true
      fail-closed: true
      default-fhir-version: R4
      token-validation:
        enabled: false
        mode: jwk-set-uri
        jwk-set-uri:
        issuer:
        audience:
        principal-claim: sub
        display-name-claim: preferred_username
        organization-claim: organization_id
        role-claims:
          - realm_access.roles
          - roles
          - scope
          - scp
      token-source:
        enabled: true
        claim-names:
          - permissions
          - permission
          - permission_json
      repository:
        enabled: false
        base-url:
        query-template:
        reuse-incoming-token: true
        bearer-token:
        timeout-seconds: 10
